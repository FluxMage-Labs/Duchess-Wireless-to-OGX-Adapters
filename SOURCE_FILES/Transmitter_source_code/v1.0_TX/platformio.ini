; DuchesS Wireless Transmitter
; Target: Seeed Studio XIAO ESP32S3 (single USB-C port)
;
; Reads the Hyperkin DuchesS controller via USB Host (GIP protocol)
; and transmits as a BLE HID gamepad named "DuchesS Wireless".
; The Pi Pico 2 W receiver auto-connects to this name.
;
; WORKFLOW:
;   1. Hold BOOT button on XIAO, plug USB-C into PC, release BOOT
;   2. Flash firmware (PlatformIO Upload)
;   3. Unplug from PC
;   4. Connect DuchesS via USB-C OTG adapter
;   5. Power XIAO via 5V pin or LiPo battery
;
; DEBUG (optional): USB-UART adapter on GPIO43(TX), 115200 baud
;
; DEPENDENCY NOTES (do not change without re-testing on hardware):
;   - NimBLE-Arduino is pinned to 2.3.9, the exact version of the
;     verified-working release build. Newer NimBLE (2.5.x) breaks the
;     BleNUS compile AND changes BLE HID behavior (controller pairs
;     but sends no inputs). Older 2.2.x pairs but inputs also fail.
;   - NimBLE-Arduino is listed FIRST so it is installed before
;     ESP32-BLE-Gamepad resolves its own unversioned NimBLE
;     dependency; otherwise two NimBLE copies get installed and
;     the link fails with "multiple definition" errors.
;   - The -ffile-prefix-map flags strip local build paths from the
;     compiled binary so no usernames/paths leak into releases.

[env:seeed_xiao_esp32s3]
platform = espressif32 @ 6.9.0
board = seeed_xiao_esp32s3
framework = arduino

build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=1
    -DCONFIG_TINYUSB_ENABLED=0
    -DCORE_DEBUG_LEVEL=3
    -DLOG_LOCAL_LEVEL=ESP_LOG_INFO
    -ffile-prefix-map=${platformio.core_dir}=.
    -ffile-prefix-map=${PROJECT_DIR}=.

; ESP32-BLE-Gamepad is NOT fetched from the registry. The registry's
; "0.7.4" changed content over time without a version bump (connection
; status semantics and the HID report descriptor were altered), which
; silently broke this project. The exact verified-working library
; source is vendored in lib/ESP32-BLE-Gamepad and is used automatically.
lib_deps =
    h2zero/NimBLE-Arduino @ 2.3.9

monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
